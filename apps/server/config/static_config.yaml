# PostgreSQL DSN is supplied via config_vars.yaml or --config-vars.
components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 4
        fs-task-processor:
            worker_threads: 2
    default_task_processor: main-task-processor
    components:
        server:
            listener:
                port: $http_port
                port#fallback: 8080
                task_processor: main-task-processor
        grpc-server:
            port: $grpc_port
            port#fallback: 8091
            service-defaults:
                task-processor: main-task-processor
        upload-database:
            dbconnection: $postgres_dsn
            blocking_task_processor: fs-task-processor
            dns_resolver: async
        dynamic-config:
            defaults:
                POSTGRES_CONNECTION_POOL_SETTINGS:
                    upload-database:
                        max_pool_size: 16
                        min_pool_size: 1
                        max_queue_size: 128
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: info
                    overflow_behavior: discard
